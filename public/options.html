<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="bilingual.css" />
  <link rel="stylesheet" href="options.css" />
  <title>雙語對照 — 設定</title>
</head>
<body>
  <main>
    <header>
      <h1>雙語對照</h1>
      <p>設定</p>
    </header>

    <section class="card">
      <h2>翻譯</h2>
      <label class="field">
        <span>引擎</span>
        <select id="provider">
          <option value="google">Google 翻譯</option>
          <option value="gemini">Gemini</option>
        </select>
      </label>

      <div id="geminiBlock" hidden>
        <label class="field">
          <span>Gemini API Key</span>
          <input type="password" id="key_gemini" placeholder="AIza..." autocomplete="off" />
        </label>
        <p class="hint">免費申請：<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></p>
        <label class="field">
          <span>模型</span>
          <input type="text" id="model" placeholder="gemini-3.5-flash-lite" />
        </label>
      </div>

      <label class="field">
        <span>圖片翻譯</span>
        <select id="imageModel">
          <option value="local">本機辨識（免費、不限次數）</option>
          <option value="gemini">Gemini 看圖（較準，每天約 20 次）</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2>外觀</h2>
      <div class="preview">
        <article class="sheet light">
          <p class="kicker">亮色頁面</p>
          <div class="ibt-block">
            <div class="ibt-pair">
              <div class="ibt-orig">The quick brown fox jumps over the lazy dog.</div>
              <div class="ibt-trans">敏捷的棕狐跨越懶狗</div>
            </div>
          </div>
        </article>
        <article class="sheet dark">
          <p class="kicker">深色頁面</p>
          <div class="ibt-block">
            <div class="ibt-pair">
              <div class="ibt-orig">The quick brown fox jumps over the lazy dog.</div>
              <div class="ibt-trans">敏捷的棕狐跨越懶狗</div>
            </div>
          </div>
        </article>
      </div>

      <div class="segment" role="radiogroup" aria-label="標記樣式">
        <label><input type="radio" name="marker" value="tint" />淡底色</label>
        <label><input type="radio" name="marker" value="bar" />左邊細條</label>
        <label><input type="radio" name="marker" value="wavy" />波浪底線</label>
        <label><input type="radio" name="marker" value="none" />無標記</label>
      </div>

      <div class="accent">
        <span>強調色</span>
        <div id="swatches" class="swatches"></div>
        <label class="hex">
          自訂
          <input id="accentHex" type="text" maxlength="7" placeholder="#RRGGBB" spellcheck="false" autocomplete="off" />
        </label>
      </div>
    </section>

    <section class="card">
      <h2>劃詞</h2>
      <label class="toggle">
        <span>劃詞翻譯</span>
        <span class="switch">
          <input type="checkbox" id="selectionTranslate" />
          <span class="slider"></span>
        </span>
      </label>
      <label class="toggle">
        <span>選取後立即顯示譯文</span>
        <span class="switch">
          <input type="checkbox" id="selectionInstant" />
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <p id="status" class="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
