<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="bilingual.css" />
  <link rel="stylesheet" href="options.css" />
  <title>雙語對照 — 設定</title>
</head>
<body>
  <div class="app">
    <aside>
      <div class="mark">
        <img src="icons/icon48.png" width="44" height="44" alt="" />
        <div>
          <strong>雙語對照</strong>
          <em id="version"></em>
        </div>
      </div>
      <a class="gh" href="https://github.com/ekkoee/thelimitsofmylanguagemeanthelimitsofmyworld" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
    </aside>

    <main>
      <section class="card" data-panel="general">
        <h2>翻譯</h2>
        <label class="field">
          <span>引擎</span>
          <select id="provider">
            <option value="google">Google 翻譯</option>
            <option value="gemini">Gemini</option>
          </select>
        </label>
        <div id="geminiBlock" hidden>
          <label class="field">
            <span class="key-label">Gemini API Key <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">取得金鑰</a></span>
            <input type="password" id="key_gemini" placeholder="貼上金鑰" autocomplete="off" spellcheck="false" />
          </label>
          <p id="keyNote" class="hint"></p>
          <label class="field">
            <span>模型</span>
            <input type="text" id="model" placeholder="gemini-3.5-flash-lite" />
          </label>
        </div>
        <label class="field">
          <span>圖片翻譯</span>
          <select id="imageModel">
            <option value="local">本機辨識（免費、不限次數）</option>
            <option value="gemini">Gemini 看圖（較準，每天約 20 次）</option>
          </select>
        </label>
        <label class="field">
          <span>翻譯成</span>
          <select id="lang">
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </label>
        <label class="field">
          <span>字幕順序</span>
          <select id="order">
            <option value="zhTop">中文在上</option>
            <option value="enTop">英文在上</option>
          </select>
        </label>
        <label class="field">
          <span>字體大小 <b id="fontScaleVal"></b></span>
          <input type="range" id="fontScale" min="0.8" max="1.6" step="0.05" />
        </label>
      </section>

      <section class="card" data-panel="look">
        <h2>外觀</h2>
        <label class="field">
          <span>譯文樣式</span>
          <select id="transStyle">
            <option value="plain">無（純文字）</option>
            <option value="underline">直線底線</option>
            <option value="dashed">虛線底線</option>
            <option value="dotted">點狀底線</option>
            <option value="wavy">波浪底線</option>
            <option value="solidBox">實線框線</option>
            <option value="dashedBox">虛線框線</option>
            <option value="highlight">醒目提示（黃底）</option>
            <option value="dim">弱化（變淡）</option>
            <option value="italic">斜體</option>
            <option value="bold">粗體</option>
            <option value="blur">模糊（學習模式 · 滑過才顯示）</option>
          </select>
        </label>
        <label class="field">
          <span>譯文顏色</span>
          <span class="color-line">
            <input type="color" id="transColor" value="#1c1c1c" aria-label="譯文顏色" />
            <button type="button" id="transColorReset" class="text-btn">跟頁面顏色</button>
          </span>
        </label>
        <label class="field">
          <span>左側標記</span>
          <select id="barStyle">
            <option value="none">無</option>
            <option value="bar">線條</option>
            <option value="thick">粗線條</option>
            <option value="dashed">虛線</option>
          </select>
        </label>
        <label class="field">
          <span>標記顏色</span>
          <span class="color-line">
            <input type="color" id="barColor" value="#6c7aff" aria-label="標記顏色" />
            <button type="button" id="barColorReset" class="text-btn">預設</button>
          </span>
        </label>
        <label class="toggle">
          <span>淡底色</span>
          <span class="switch"><input type="checkbox" id="transHighlight" checked /><span class="slider"></span></span>
        </label>
        <div class="tint-live">
          <div class="tone-light">
            <p>The quick brown fox jumps over the lazy dog.</p>
            <div class="ibt-block"><div class="ibt-trans" data-ibt-on="light"><span>敏捷的棕狐跨越懶狗，然後在河邊停下來。</span></div></div>
          </div>
          <div class="tone-dark">
            <p>The quick brown fox jumps over the lazy dog.</p>
            <div class="ibt-block"><div class="ibt-trans" data-ibt-on="dark"><span>敏捷的棕狐跨越懶狗，然後在河邊停下來。</span></div></div>
          </div>
        </div>
      </section>

      <section class="card" data-panel="advanced">
        <h2>劃詞</h2>
        <label class="toggle">
          <span>劃詞翻譯</span>
          <span class="switch"><input type="checkbox" id="selectionTranslate" /><span class="slider"></span></span>
        </label>
        <label class="toggle">
          <span>選取後立即顯示</span>
          <span class="switch"><input type="checkbox" id="selectionInstant" /><span class="slider"></span></span>
        </label>
      </section>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
