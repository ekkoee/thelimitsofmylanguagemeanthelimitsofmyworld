<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="bilingual.css" />
  <link rel="stylesheet" href="options.css" />
  <title>雙語對照 — 設定</title>
</head>
<body>
  <div class="app">
    <aside>
      <div class="mark">
        <img src="icons/icon48.png" width="44" height="44" alt="" />
        <div>
          <strong>雙語對照</strong>
          <em id="version"></em>
        </div>
      </div>
      <a class="ext" href="https://github.com/ekkoee/thelimitsofmylanguagemeanthelimitsofmyworld" target="_blank" rel="noopener">原始碼</a>
    </aside>

    <main>
      <article class="reader" id="reader">
        <label class="reader-dark"><input type="checkbox" id="readerDark" /> 暗頁</label>
        <p class="reader-en">The quiet page keeps its own color. The translation follows in the same measure.</p>
        <div class="ibt-block">
          <div class="ibt-trans" id="readerZh">安靜的頁面保留自己的顏色。譯文跟在後面，字級不變。</div>
        </div>
      </article>

      <section data-panel="general">
        <p class="eyebrow">一般</p>
        <h2>怎麼翻譯</h2>
        <label class="field">
          <span>引擎</span>
          <select id="provider">
            <option value="google">Google 翻譯</option>
            <option value="gemini">Gemini</option>
          </select>
        </label>
        <div id="geminiBlock" hidden>
          <label class="field">
            <span class="key-label">Gemini API Key <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">取得金鑰</a></span>
            <input type="password" id="key_gemini" placeholder="貼上 AIza…" autocomplete="off" spellcheck="false" />
          </label>
          <p id="keyNote" class="hint"></p>
          <label class="field">
            <span>模型</span>
            <input type="text" id="model" placeholder="gemini-3.5-flash-lite" />
          </label>
        </div>
        <label class="field">
          <span>圖片翻譯</span>
          <select id="imageModel">
            <option value="local">本機辨識（免費、不限次數）</option>
            <option value="gemini">Gemini 看圖（較準，每天約 20 次）</option>
          </select>
        </label>
        <label class="field">
          <span>翻譯成</span>
          <select id="lang">
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </label>
        <label class="field">
          <span>字幕順序</span>
          <select id="order">
            <option value="zhTop">中文在上</option>
            <option value="enTop">英文在上</option>
          </select>
        </label>
        <label class="field">
          <span>字體大小 <b id="fontScaleVal"></b></span>
          <input type="range" id="fontScale" min="0.8" max="1.6" step="0.05" />
        </label>
      </section>

      <section data-panel="look">
        <p class="eyebrow">外觀</p>
        <h2>譯文長什麼樣子</h2>
        <label class="toggle">
          <span>淡底色</span>
          <span class="switch"><input type="checkbox" id="transHighlight" checked /><span class="slider"></span></span>
        </label>
        <div class="tint-live">
          <div class="tone-light">
            <p>The quick brown fox jumps over the lazy dog.</p>
            <p class="line"><span class="ibt-trans" data-ibt-on="light">敏捷的棕狐跨越懶狗</span></p>
          </div>
          <div class="tone-dark">
            <p>The quick brown fox jumps over the lazy dog.</p>
            <p class="line"><span class="ibt-trans" data-ibt-on="dark">敏捷的棕狐跨越懶狗</span></p>
          </div>
        </div>
      </section>

      <section data-panel="advanced">
        <p class="eyebrow">進階</p>
        <h2>劃詞</h2>
        <label class="toggle">
          <span>劃詞翻譯</span>
          <span class="switch"><input type="checkbox" id="selectionTranslate" /><span class="slider"></span></span>
        </label>
        <label class="toggle">
          <span>選取後立即顯示譯文</span>
          <span class="switch"><input type="checkbox" id="selectionInstant" /><span class="slider"></span></span>
        </label>
      </section>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
