<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>雙語對照</title>
</head>
<body>
  <header>
    <strong>雙語對照</strong>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </header>

  <div class="cta">
    <button id="translatePage">🌐 翻譯這個網頁</button>
    <div id="ctaHint" class="cta-hint">也可按 Alt+A 循環切換：原文 → 只中文 → 原文+中文</div>
  </div>

  <section>
    <div class="row">
      <label for="lang">翻譯成</label>
      <select id="lang">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
      </select>
    </div>

    <div class="row">
      <label for="viewMode">譯文呈現</label>
      <select id="viewMode">
        <option value="both">原文＋中文對照</option>
        <option value="zh">只顯示中文</option>
        <option value="orig">只顯示原文（關閉譯文）</option>
      </select>
    </div>

    <div class="row">
      <label for="order">字幕順序</label>
      <select id="order">
        <option value="zhTop">中文在上</option>
        <option value="enTop">英文在上</option>
      </select>
    </div>

    <div class="row">
      <label for="fontScale">字體大小</label>
      <input type="range" id="fontScale" min="0.8" max="1.6" step="0.05" />
      <span id="fontScaleVal" class="muted"></span>
    </div>

    <div class="row">
      <label for="provider">翻譯引擎</label>
      <select id="provider">
        <option value="google">Google 翻譯（免費）</option>
        <option value="gemini">Gemini（需 API key）</option>
      </select>
    </div>
    <button id="keyHint" class="key-hint" hidden>尚未設定 Gemini API key，點此前往設定 →</button>
  </section>

  <footer>
    <button id="openOptions">更多設定 →</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
