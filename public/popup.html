<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>雙語對照</title>
</head>
<body>
  <header>
    <img src="icons/icon48.png" width="28" height="28" alt="" />
    <h1>雙語對照</h1>
    <label class="switch">
      <input type="checkbox" id="enabled" aria-label="啟用翻譯" />
      <span class="slider"></span>
    </label>
  </header>

  <button id="translatePage" type="button">翻譯這個網頁</button>
  <p id="ctaHint" class="hint">Alt+A 切換原文、中文、對照</p>

  <label class="field">
    <span>翻譯成</span>
    <select id="lang">
      <option value="zh-TW">繁體中文</option>
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select>
  </label>

  <label class="field">
    <span>譯文呈現</span>
    <select id="viewMode">
      <option value="both">原文＋中文對照</option>
      <option value="zh">只顯示中文</option>
      <option value="orig">只顯示原文</option>
    </select>
  </label>

  <button id="openOptions" type="button">設定</button>
  <script src="popup.js"></script>
</body>
</html>
